<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文書文字起こし</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{
  font-family:system-ui,sans-serif;
  max-width:680px;
  margin:0 auto;
  padding:24px;
  background:#f6f6f6
}
.card{
  background:white;
  border-radius:16px;
  padding:22px;
  box-shadow:0 2px 12px #0001
}
h1{font-size:24px}
input,button{
  font-size:18px;
  padding:14px;
  margin-top:10px;
  width:100%;
  box-sizing:border-box
}
button{
  cursor:pointer;
  border:0;
  border-radius:10px;
  background:#222;
  color:white
}
button:disabled{
  background:#999;
  cursor:not-allowed
}
#preview{
  max-width:100%;
  margin-top:15px;
  border-radius:10px
}
#result{
  white-space:pre-wrap;
  background:#fafafa;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
  min-height:100px
}
.small{
  font-size:13px;
  color:#666;
  margin-top:10px
}
</style>
</head>

<body>

<div class="card">

<h1>📄 文書文字起こし</h1>

<p>スマホで文書を撮影し、日本語の文字を読み取ります。</p>

<input
  id="photo"
  type="file"
  accept="image/*"
  capture="environment"
>

<img id="preview" hidden>

<button id="run">文字起こしする</button>

<div id="status" class="small"></div>

<div id="result"></div>

<button id="copy">結果をコピー</button>

</div>

<script>

const photo = document.getElementById('photo');
const preview = document.getElementById('preview');
const result = document.getElementById('result');
const status = document.getElementById('status');
const runButton = document.getElementById('run');
const copyButton = document.getElementById('copy');

photo.onchange = () => {

  const file = photo.files[0];

  if (!file) return;

  preview.src = URL.createObjectURL(file);
  preview.hidden = false;

  result.textContent = '';
  status.textContent = '写真を選択しました。';

};

runButton.onclick = async () => {

  const file = photo.files[0];

  if (!file) {
    alert('文書の写真を選択してください。');
    return;
  }

  runButton.disabled = true;
  result.textContent = '';

  try {

    status.textContent =
      'OCRエンジンを準備しています。初回は少し時間がかかります…';

    const worker = await Tesseract.createWorker('jpn');

    status.textContent =
      'AIではなくブラウザ内OCRで文字を読み取っています…';

    const { data } = await worker.recognize(file);

    await worker.terminate();

    result.textContent = data.text;

    status.textContent =
      '完了しました。';

  } catch (error) {

    console.error(error);

    status.textContent = 'エラーが発生しました。';

    result.textContent =
      '文字起こしに失敗しました。\n\n' +
      error.message;

  } finally {

    runButton.disabled = false;

  }

};

copyButton.onclick = async () => {

  if (!result.textContent) {
    alert('コピーする文字がありません。');
    return;
  }

  try {

    await navigator.clipboard.writeText(result.textContent);

    status.textContent =
      'コピーしました。';

  } catch (error) {

    alert('コピーできませんでした。');

  }

};

</script>

</body>
</html>
